# Keep all development runtime files inside the repository. / 将所有开发运行时文件保存在仓库内。
error_log .zharness/nginx-error.log warn;
pid .zharness/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log .zharness/nginx-access.log;
    client_body_temp_path .zharness/nginx-temp/client-body;
    proxy_temp_path .zharness/nginx-temp/proxy;

    # Preserve WebSocket upgrades used by Next.js development HMR. / 保留 Next.js 开发热更新使用的 WebSocket 升级。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream zharness_frontend {
        server 127.0.0.1:3000;
    }

    upstream zharness_backend {
        server 127.0.0.1:2024;
    }

    server {
        listen 2026;
        listen [::]:2026;
        server_name _;

        # Keep large prompt and attachment handling above the application limit. / 将长提示词和附件的代理限制保持在应用限制之上。
        client_max_body_size 100M;

        # Strip the public prefix before forwarding LangGraph API requests. / 转发 LangGraph API 请求前移除公开路径前缀。
        location ^~ /api/langgraph/ {
            proxy_pass http://zharness_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Forward pages, assets, and HMR traffic to Next.js. / 将页面、静态资源和热更新流量转发到 Next.js。
        location / {
            proxy_pass http://zharness_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
