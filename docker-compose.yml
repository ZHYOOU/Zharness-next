services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ZHARNESS_POSTGRES_USER:-zharness}
      POSTGRES_PASSWORD: ${ZHARNESS_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${ZHARNESS_POSTGRES_DB:-zharness}
    ports:
      - "127.0.0.1:${ZHARNESS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
