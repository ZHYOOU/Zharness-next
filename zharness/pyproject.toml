[project]
name = "zharness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhyoo", email = "zhyoo0347@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0,<8",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0,<2",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "starlette>=1.6.0",
    "wcmatch>=11.0.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-sdk>=0.4.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
