repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: uv run --package zharness ruff format --check zharness
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Ruff lint check
        entry: uv run --package zharness ruff check zharness
        language: system
        pass_filenames: false

      - id: pytest
        name: ZHarness unit tests
        entry: uv run --package zharness pytest zharness/tests -q
        language: system
        pass_filenames: false